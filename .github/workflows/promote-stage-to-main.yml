# Продвижение: stage → main
#
# Ручной запуск: Actions → «Promote: stage → main» → Run workflow.
# Что делает:
#   1. Сливает ветку stage в main (merge --no-ff — всегда явный коммит продвижения)
#   2. Пушит main
#   3. Запускает деплой main (через workflow_dispatch воркфлоу Deploy)
#   4. Шлёт уведомление в Telegram о продвижении
#
# Особенности те же, что у promote-dev-to-stage.yml:
#   - Кнопка «Run workflow» видна, только если файл на дефолтной ветке репо.
#   - Деплой запускается явно через `gh workflow run` (GITHUB_TOKEN не триггерит его сам).

name: "Promote: stage → main"

on:
  workflow_dispatch:

concurrency:
  group: promote-stage-main
  cancel-in-progress: false

permissions:
  contents: write # push в main
  actions: write  # запуск воркфлоу Deploy

jobs:
  promote:
    name: Merge stage → main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Чекаутим целевую ветку — main, с полной историей.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Настроить git-идентичность
        run: |
          git config user.name "fidenta-pipeline[bot]"
          git config user.email "actions@github.com"

      - name: Слить stage в main
        run: |
          git fetch origin stage
          if git merge --no-ff origin/stage -m "Promote: stage → main (run #${{ github.run_number }})"; then
            echo "Слияние выполнено (или ветка уже актуальна)."
          else
            echo "::error::Конфликт слияния stage → main. Разреши вручную и запусти снова."
            git merge --abort || true
            exit 1
          fi

      - name: Запушить main
        run: git push origin main

      - name: Запустить деплой main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main \
            || echo "::warning::Не удалось запустить Deploy автоматически. Запусти вручную: Actions → Deploy → Run workflow (ветка main)."

      - name: Уведомление в Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram-секреты не заданы — уведомление пропущено."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            TEXT=$(printf '🚀 Продвижение: stage → main\n\n✅ main обновлён кодом из stage, запущен деплой продакшена.\n🌐 https://keegooroomie.github.io/fidenta-landing/\n👤 Запустил: %s' "$ACTOR")
          else
            TEXT=$(printf '🚀 Продвижение: stage → main\n\n❌ Не выполнено — проверь логи.\nВозможные причины: конфликт слияния или нет ветки main.\n👤 %s\n📋 %s' "$ACTOR" "$RUN_URL")
          fi

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "Telegram response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || echo "::warning::Telegram API вернул ошибку: $RESPONSE"
