# Деплой на GitHub Pages
#
# Триггер: push в main, stage или dev
# Каждая ветка деплоится в свою подпапку gh-pages ветки:
#   main  → keegooroomie.github.io/fidenta-landing/
#   stage → keegooroomie.github.io/fidenta-landing/stage/
#   dev   → keegooroomie.github.io/fidenta-landing/dev/
#
# После деплоя — уведомление в Telegram с АКТУАЛЬНОЙ ссылкой на задеплоенную ветку.
# Уведомление встроено прямо сюда (а не в отдельный workflow_run), потому что:
#   1. Нужна ссылка, зависящая от ветки — она вычисляется здесь же
#   2. workflow_run требует, чтобы файл был на дефолтной ветке; inline-шаг работает сразу
#
# ВАЖНО: GitHub Pages должен быть настроен в Settings → Pages → Source: Deploy from a branch → gh-pages
# Этот воркфлоу сам создаёт и обновляет ветку gh-pages.
#
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  — токен бота
#   TELEGRAM_CHAT_ID    — ID чата для уведомлений

name: Deploy

on:
  push:
    branches:
      - main
      - stage
      - dev
  # Ручной запуск деплоя выбранной ветки (Actions → Deploy → Run workflow).
  # Этот же триггер используют воркфлоу продвижения (promote-*) — они запускают
  # деплой целевой ветки через `gh workflow run deploy.yml --ref <branch>` после мержа.
  # ВАЖНО: чтобы dispatch работал, deploy.yml должен быть на дефолтной ветке репо.
  workflow_dispatch:

# Одновременно может выполняться только один деплой для каждой ветки.
# Если пришёл новый push, пока идёт деплой — старый деплой отменяется.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

# Права для записи в gh-pages ветку
permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Скачиваем код ветки, которая триггернула воркфлоу
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Устанавливаем pnpm (должен идти ДО setup-node для корректного кэша)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. Устанавливаем Node.js с кэшированием pnpm-зависимостей
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. Устанавливаем зависимости строго по pnpm-lock.yaml
      # --frozen-lockfile запрещает изменение lockfile в CI — защита от «у меня работало»
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Определяем base path, целевую папку, стратегию очистки и URL сайта по ветке.
      # base path нужен Astro для правильных ссылок на ресурсы.
      # url — публичная ссылка на задеплоенную версию (домен Pages + base path).
      # clean_exclude: при деплое main в корень сохраняем папки stage/ и dev/.
      - name: Set deploy config
        id: config
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          case "${{ github.ref_name }}" in
            main)
              BASE="/fidenta-landing/"
              TARGET="."
              CLEAN_EXCLUDE=$'stage\ndev'
              ;;
            stage)
              BASE="/fidenta-landing/stage/"
              TARGET="stage"
              CLEAN_EXCLUDE=""
              ;;
            dev)
              BASE="/fidenta-landing/dev/"
              TARGET="dev"
              CLEAN_EXCLUDE=""
              ;;
            *)
              echo "::error::Неожиданная ветка: ${{ github.ref_name }}. Ожидается main, stage или dev."
              exit 1
              ;;
          esac

          # Публичная ссылка = домен GitHub Pages владельца + base path
          URL="https://${OWNER}.github.io${BASE}"

          echo "base=$BASE"     >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "url=$URL"       >> $GITHUB_OUTPUT
          # clean_exclude может быть многострочным — пишем через heredoc
          {
            echo "clean_exclude<<EOF"
            echo "$CLEAN_EXCLUDE"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 6. Собираем Astro с нужным base path. id: build — чтобы уведомление
      # могло отличить провал сборки от провала деплоя.
      - name: Build
        id: build
        env:
          ASTRO_BASE_PATH: ${{ steps.config.outputs.base }}
        run: pnpm build

      # 7. Пушим dist/ в нужную подпапку gh-pages.
      # clean: true чистит устаревшие файлы, clean-exclude защищает папки других веток.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: ${{ steps.config.outputs.target }}
          clean: true
          clean-exclude: ${{ steps.config.outputs.clean_exclude }}

      # 8. Уведомление в Telegram. if: always() — шаг выполняется даже если
      # сборка или деплой упали, чтобы сообщить об ошибке.
      # Все значения читаются через env (не интерполируются в shell) — защита от injection.
      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_OUTCOME:  ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SITE_URL:       ${{ steps.config.outputs.url }}
          ACTOR:          ${{ github.actor }}
          BRANCH:         ${{ github.ref_name }}
          SHA:            ${{ github.sha }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Если секреты не заданы (например, форк без доступа) — молча выходим, не падаем
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram-секреты не заданы — уведомление пропущено."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          # Текст зависит от результата шагов build и deploy.
          # Если build не success — сначала сообщаем об ошибке сборки.
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$DEPLOY_OUTCOME" = "success" ]; then
            TEXT=$(printf '✅ Деплой успешен — @%s\n🌿 Ветка: %s\n📝 Коммит: %s\n🌐 %s' "$ACTOR" "$BRANCH" "$SHORT_SHA" "$SITE_URL")
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            TEXT=$(printf '❌ Ошибка сборки — @%s\n🌿 Ветка: %s\n📝 Коммит: %s\n📋 Логи: %s' "$ACTOR" "$BRANCH" "$SHORT_SHA" "$RUN_URL")
          else
            TEXT=$(printf '❌ Ошибка деплоя — @%s\n🌿 Ветка: %s\n📝 Коммит: %s\n📋 Логи: %s' "$ACTOR" "$BRANCH" "$SHORT_SHA" "$RUN_URL")
          fi

          # --data-urlencode безопасно кодирует текст (включая переносы строк и спецсимволы),
          # в отличие от ручного %0A. Проверяем ответ API — молчаливый сбой хуже явного.
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || echo "::warning::Telegram API вернул ошибку: $RESPONSE"
